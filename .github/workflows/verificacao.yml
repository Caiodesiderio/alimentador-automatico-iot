# =====================================================================
#  Verificação automática do repositório
# =====================================================================
#  Roda a cada envio de código, na infraestrutura do GitHub, e o
#  resultado é público: qualquer pessoa abre a aba Actions e vê o log
#  completo, sem precisar de acesso ao banco de ninguém e sem precisar
#  acreditar em quem escreveu a documentação.
#
#  O que é conferido:
#    1. os arquivos publicados batem com os SHA-256 declarados;
#    2. regerar o conjunto do zero produz arquivos idênticos;
#    3. os números do DATASET.md saem mesmo do pipeline;
#    4. as oito migrations aplicam em um PostgreSQL limpo e deixam o
#       banco com as contagens declaradas.
# =====================================================================

name: Verificação

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dataset:
    name: Dataset e análise (K-means e Z-score)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r analise/requirements.txt

      - name: Conferir integridade, reprodutibilidade e resultados
        run: python analise/verificar.py

  banco:
    name: Migrations em um PostgreSQL limpo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Garantir o cliente psql
        run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Aplicar as oito migrations, na ordem
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -q -f supabase/ci/stub_supabase.sql
          for arquivo in supabase/migrations/0*.sql; do
            echo "--> $arquivo"
            psql -v ON_ERROR_STOP=1 -q -f "$arquivo"
          done

      - name: Conferir as contagens do banco
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/verificar_banco.sql
